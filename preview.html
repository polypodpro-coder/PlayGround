    function createImageHeightfieldGeometry(img, dims) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const nx = 32;
      const ny = 32;
      canvas.width = nx;
      canvas.height = ny;
      ctx.drawImage(img, 0, 0, nx, ny);
      const imgData = ctx.getImageData(0, 0, nx, ny).data;

      const w = dims.x / 18;
      const h = dims.y / 18;
      const maxDepth = dims.z / 22;
      const baseThickness = 0.38;

      const positions = [];
      const uvs = [];
      const indices = [];

      const heights = [];
      for (let j = 0; j < ny; j++) {
        heights[j] = [];
        for (let i = 0; i < nx; i++) {
          const idx = (j * nx + i) * 4;
          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];
          const a = imgData[idx + 3] / 255;
          const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          const relief = (1 - lum) * a;
          heights[j][i] = baseThickness + relief * maxDepth;
        }
      }

      // Top surface
      for (let j = 0; j < ny; j++) {
        const y = ((j / (ny - 1)) - 0.5) * h;
        for (let i = 0; i < nx; i++) {
          const x = ((i / (nx - 1)) - 0.5) * w;
          const z = heights[j][i];
          positions.push(x, y, z);
          uvs.push(i / (nx - 1), 1 - (j / (ny - 1)));
        }
      }

      for (let j = 0; j < ny - 1; j++) {
        for (let i = 0; i < nx - 1; i++) {
          const a = j * nx + i;
          const b = j * nx + (i + 1);
          const c = (j + 1) * nx + i;
          const d = (j + 1) * nx + (i + 1);
          indices.push(a, b, c);
          indices.push(b, d, c);
        }
      }

      // Bottom flat base plate
      const bottomOffset = positions.length / 3;
      for (let j = 0; j < ny; j++) {
        const y = ((j / (ny - 1)) - 0.5) * h;
        for (let i = 0; i < nx; i++) {
          const x = ((i / (nx - 1)) - 0.5) * w;
          positions.push(x, y, 0);
          uvs.push(i / (nx - 1), 1 - (j / (ny - 1)));
        }
      }

      for (let j = 0; j < ny - 1; j++) {
        for (let i = 0; i < nx - 1; i++) {
          const a = bottomOffset + (j * nx + i);
          const b = bottomOffset + (j * nx + (i + 1));
          const c = bottomOffset + ((j + 1) * nx + i);
          const d = bottomOffset + ((j + 1) * nx + (i + 1));
          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      // Side skirts
      for (let i = 0; i < nx - 1; i++) {
        const t1 = i, t2 = i + 1;
        const b1 = bottomOffset + i, b2 = bottomOffset + i + 1;
        indices.push(t1, b1, t2);
        indices.push(t2, b1, b2);
      }
      for (let i = 0; i < nx - 1; i++) {
        const t1 = (ny - 1) * nx + i, t2 = (ny - 1) * nx + i + 1;
        const b1 = bottomOffset + (ny - 1) * nx + i, b2 = bottomOffset + (ny - 1) * nx + i + 1;
        indices.push(t1, t2, b1);
        indices.push(t2, b2, b1);
      }
      for (let j = 0; j < ny - 1; j++) {
        const t1 = j * nx, t2 = (j + 1) * nx;
        const b1 = bottomOffset + j * nx, b2 = bottomOffset + (j + 1) * nx;
        indices.push(t1, t2, b1);
        indices.push(t2, b2, b1);
      }
      for (let j = 0; j < ny - 1; j++) {
        const t1 = j * nx + (nx - 1), t2 = (j + 1) * nx + (nx - 1);
        const b1 = bottomOffset + j * nx + (nx - 1), b2 = bottomOffset + (j + 1) * nx + (nx - 1);
        indices.push(t1, b1, t2);
        indices.push(t2, b1, b2);
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      geom.center();
      return geom;
    }

    function createPartGeometry(type, dims) {
      const sx = dims.x / 20;
      const sy = dims.y / 20;
      const sz = dims.z / 20;

      if (type === "knob") {
        return new THREE.CylinderGeometry(sx * 0.9, sx * 0.95, sy * 0.8, 28);
      }
      if (type === "clip") {
        const shape = new THREE.Shape();
        shape.moveTo(-sx, -sy);
        shape.lineTo(sx, -sy);
        shape.lineTo(sx, sy);
        shape.lineTo(sx * 0.6, sy);
        shape.lineTo(sx * 0.6, -sy * 0.5);
        shape.lineTo(-sx * 0.6, -sy * 0.5);
        shape.lineTo(-sx * 0.6, sy);
        shape.lineTo(-sx, sy);
        shape.closePath();
        const geom = new THREE.ExtrudeGeometry(shape, { steps: 1, depth: sz, bevelEnabled: true, bevelThickness: 0.15, bevelSize: 0.15, bevelSegments: 2 });
        geom.center();
        return geom;
      }
      if (type === "enclosure") {
        return new THREE.BoxGeometry(sx * 1.6, sy * 1.1, sz * 0.8, 4, 4, 4);
      }
      if (type === "bracket") {
        const shape = new THREE.Shape();
        const t = 0.45;
        shape.moveTo(0, 0);
        shape.lineTo(sx * 1.2, 0);
        shape.lineTo(sx * 1.2, t);
        shape.lineTo(t, t);
        shape.lineTo(t, sy * 1.2);
        shape.lineTo(0, sy * 1.2);
        shape.closePath();
        const geom = new THREE.ExtrudeGeometry(shape, { steps: 1, depth: sz * 1.1, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.1, bevelSegments: 3 });
        geom.center();
        return geom;
      }
      return new THREE.BoxGeometry(sx, sy, sz);
    }

    function init3DViewer() {
      const canvas = document.getElementById('three-canvas');
      const container = document.getElementById('canvas-container');
      if (!canvas || !container) return;

      if (viewport.animFrame) cancelAnimationFrame(viewport.animFrame);
      if (viewport.renderer) viewport.renderer.dispose();

      const width = container.clientWidth || 360;
      const height = 230;

      const scene = new THREE.Scene();
      viewport.scene = scene;

      const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 100);
      camera.position.set(4.2, 3.5, 4.5);
      camera.lookAt(0, 0, 0);
      viewport.camera = camera;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      viewport.renderer = renderer;

      // Lights
      const ambient = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambient);
      const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
      keyLight.position.set(5, 8, 4);
      scene.add(keyLight);
      const fillLight = new THREE.DirectionalLight(0x90b0e0, 0.6);
      fillLight.position.set(-5, 2, -3);
      scene.add(fillLight);

      // Bed Grid
      const grid = new THREE.GridHelper(6, 12, 0x3d5a80, 0x1f334a);
      grid.position.y = -1.2;
      scene.add(grid);

      const p = state.selectedPreset;
      let geom;

      if (p.isCustomPhoto && p.imgElement) {
        geom = createImageHeightfieldGeometry(p.imgElement, p.dimensions);
      } else {
        geom = createPartGeometry(p.type, p.dimensions);
      }

      const matColor = state.material === "PETG" ? 0xe8752d : (state.material === "PLA" ? 0x2563eb : (state.material === "ABS" ? 0x475569 : 0x10b981));

      const material = new THREE.MeshStandardMaterial({
        color: matColor,
        roughness: 0.35,
        metalness: 0.15,
        wireframe: state.wireframe
      });

      if (p.isCustomPhoto && state.viewMode === "textured") {
        const texLoader = new THREE.TextureLoader();
        texLoader.load(p.photoUrl, (tex) => {
          if (viewport.mesh && viewport.mesh.material && state.viewMode === "textured") {
            viewport.mesh.material.map = tex;
            viewport.mesh.material.color.setHex(0xffffff);
            viewport.mesh.material.needsUpdate = true;
          }
        });
      }

      const mesh = new THREE.Mesh(geom, material);
      scene.add(mesh);
      viewport.mesh = mesh;

      // Orbit Interactions
      const onDown = (e) => {
        viewport.isDragging = true;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        viewport.prevMouse = { x: cx, y: cy };
        if (e.touches && e.cancelable) e.preventDefault();
      };

      const onMove = (e) => {
        if (!viewport.isDragging || !viewport.mesh) return;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        const dx = cx - viewport.prevMouse.x;
        const dy = cy - viewport.prevMouse.y;
        viewport.mesh.rotation.y += dx * 0.012;
        viewport.mesh.rotation.x += dy * 0.012;
        viewport.prevMouse = { x: cx, y: cy };
        if (e.touches && e.cancelable) e.preventDefault();
      };

      const onUp = () => { viewport.isDragging = false; };

      canvas.onmousedown = onDown;
      canvas.ontouchstart = onDown;
      window.onmousemove = onMove;
      window.ontouchmove = onMove;
      window.onmouseup = onUp;
      window.ontouchend = onUp;

      const animate = () => {
        viewport.animFrame = requestAnimationFrame(animate);
        if (viewport.mesh && state.autoRotate && !viewport.isDragging) {
          viewport.mesh.rotation.y += 0.008;
        }
        renderer.render(scene, camera);
      };
      animate();
    }

    function resetCamera() {
      if (!viewport.camera || !viewport.mesh) return;
      viewport.camera.position.set(4.2, 3.5, 4.5);
      viewport.camera.lookAt(0, 0, 0);
      viewport.mesh.rotation.set(0, 0, 0);
    }

    function exportSTL() {
      if (!viewport.mesh) return;
      const rawGeom = viewport.mesh.geometry;
      const g = rawGeom.index ? rawGeom.toNonIndexed() : rawGeom;
      const pos = g.attributes.position;
      const numTriangles = pos.count / 3;
      const buffer = new ArrayBuffer(84 + 50 * numTriangles);
      const view = new DataView(buffer);
      view.setUint32(80, numTriangles, true);

      for (let i = 0; i < numTriangles; i++) {
        const offset = 84 + i * 50;
        for (let v = 0; v < 3; v++) {
          const idx = i * 3 + v;
          view.setFloat32(offset + 12 + v * 12, pos.getX(idx), true);
          view.setFloat32(offset + 16 + v * 12, pos.getY(idx), true);
          view.setFloat32(offset + 20 + v * 12, pos.getZ(idx), true);
        }
      }

      const blob = new Blob([buffer], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${state.selectedPreset.id || 'reconstructed'}_part.stl`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // AI 2D-to-3D Reconstruction Pipeline
    function triggerAIPhotoReconstruction(file, photoUrl) {
      state.screen = "request";
      state.showUploadMenu = false;
      state.isGenerating = true;
      state.generationProgress = 15;
      state.generationStage = "Ingesting 2D reference photo & extracting edge boundaries...";

      const rawName = file ? file.name : "reference_image.jpg";
      const cleanName = file ? file.name.replace(/\.[^/.]+$/, "") : "Custom 3D Part";
      const fileSize = file ? (file.size / 1024).toFixed(1) + " KB" : "96.4 KB";

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        const aspect = img.naturalWidth / Math.max(1, img.naturalHeight);
        const calcX = Math.round(52 * Math.max(0.65, Math.min(1.6, aspect)));
        const calcY = 44;
        const calcZ = 22;
        const calcGrams = Math.max(16, Math.round((calcX * calcY * calcZ) / 1050));

        const newCustomPreset = {
          id: "custom_" + Date.now(),
          name: cleanName,
          type: "heightfield",
          isCustomPhoto: true,
          photoUrl: photoUrl,
          imgElement: img,
          fileName: rawName,
          fileSize: fileSize,
          dimensions: { x: calcX, y: calcY, z: calcZ },
          estimatedGrams: calcGrams,
          recommendedMaterial: "PETG",
          infillRecommendation: "35% gyroid",
          agentSummary: `AI analyzed 2D reference photo "${rawName}" (${img.naturalWidth} x ${img.naturalHeight}px). Extracted silhouette boundary, symmetry planes, and surface depth topology. Reconstructed watertight manifold 3D mesh with 2.4mm minimum structural wall thickness.`,
        };

        state.selectedPreset = newCustomPreset;
        state.customPresets.unshift(newCustomPreset);
        state.material = "PETG";
        state.viewMode = "textured";

        render();

        const stages = [
          { progress: 34, stage: "Detecting 2D perspective vanishing points & contours..." },
          { progress: 60, stage: "Inferring volumetric depth field & 3D symmetry planes..." },
          { progress: 80, stage: "Synthesizing manifold 3D polygon mesh with Meshy AI engine..." },
          { progress: 94, stage: "Verifying wall thickness (2.4mm) & FDM slicer printability..." },
          { progress: 100, stage: "3D Model Synthesized Successfully! Watertight & Manifold." },
        ];

        let idx = 0;
        const interval = setInterval(() => {
          if (idx < stages.length) {
            state.generationProgress = stages[idx].progress;
            state.generationStage = stages[idx].stage;
            idx++;
            const bar = document.getElementById("gen-progress-bar");
            const text = document.getElementById("gen-progress-stage");
            const pct = document.getElementById("gen-progress-pct");
            if (bar) bar.style.width = `${state.generationProgress}%`;
            if (text) text.textContent = state.generationStage;
            if (pct) pct.textContent = `${state.generationProgress}%`;
          } else {
            clearInterval(interval);
            state.isGenerating = false;
            render();
          }
        }, 450);
      };
      img.src = photoUrl;
    }

    function setupChatEvents() {
      const closeBtn = document.getElementById("btn-close-chat");

      const sendUserMessage = (text) => {
        if (!text || !text.trim()) return;
        const msg = text.trim();
        state.chatMessages.push({
          sender: "user",
          text: msg,
          time: "Just now"
        });
        if (input) input.value = "";
        render();

        // Simulate Operator Response
        setTimeout(() => {
          const typingEl = document.getElementById("chat-typing-indicator");
          if (typingEl) typingEl.classList.remove("hidden");
          const msgContainer = document.getElementById("chat-messages-container");
          if (msgContainer) msgContainer.scrollTop = msgContainer.scrollHeight;

          setTimeout(() => {
            let reply = `Got it! I reviewed the 3D model volume. Overhangs look well within 45 degrees, so it will print clean without surface scars. Ready when you are!`;
            const lower = msg.toLowerCase();
            if (lower.includes("petg") || lower.includes("material")) {
              reply = `Yes! We have Bambu PETG-CF and standard PETG loaded right now. It gives great layer adhesion and heat resistance up to 75&deg;C. Perfect for functional parts.`;
            } else if (lower.includes("today") || lower.includes("pick up") || lower.includes("pickup")) {
              reply = `Yes! Our queue is clear on Bambu Lab #1. If you place the quote order within the hour, it will be ready for local hub pickup by 4:30 PM today.`;
            } else if (lower.includes("tolerance")) {
              reply = `We calibrate with a 0.4mm hardened nozzle regularly. Typical dimensional accuracy is &plusmn;0.15mm, perfect for M4 mounting holes and snap fits.`;
            }

            state.chatMessages.push({
              sender: "shop",
              text: reply,
              time: "Just now"
            });
            render();
            const finalContainer = document.getElementById("chat-messages-container");
            if (finalContainer) finalContainer.scrollTop = finalContainer.scrollHeight;
          }, 1100);
        }, 200);
      };

      if (sendBtn && input) {
        sendBtn.onclick = () => sendUserMessage(input.value);
        input.onkeydown = (e) => {
          if (e.key === "Enter") sendUserMessage(input.value);
        };
      }

      document.querySelectorAll(".btn-quick-chat").forEach(btn => {
        btn.onclick = () => {
          const msg = btn.getAttribute("data-msg");
          sendUserMessage(msg);
        };
      });

      if (container) container.scrollTop = container.scrollHeight;
    }

                  <div>
                    <span class="text-xs font-bold text-[#0f2a4a]">Poly POD Net30 Invoiced</span>
                    <p class="text-[10px] text-[#0f2a4a]/50">For engineering labs &amp; verified businesses</p>
                  </div>
                </div>
                <span class="text-xs font-bold text-[#0f2a4a]/60">Net30</span>
              </label>
            </div>
          </div>

          <!-- Price Breakdown -->
          <div class="rounded-xl bg-[#0f2a4a]/5 p-3.5 space-y-1.5 text-xs text-[#0f2a4a]">
            <div class="flex justify-between">
              <span class="text-[#0f2a4a]/70">3D Part Manufacture (${state.material})</span>
              <span>$${basePrice.toFixed(2)}</span>
            </div>
            <div class="flex justify-between">
              <span class="text-[#0f2a4a]/70">Fulfillment (${state.deliveryOption === 'pickup' ? 'Hub Pickup' : 'Courier'})</span>
              <span>${courierFee === 0 ? 'Free' : '$' + courierFee.toFixed(2)}</span>
            </div>
            <div class="flex justify-between">
              <span class="text-[#0f2a4a]/70">Escrow Security &amp; Slicer Fee</span>
              <span>$${serviceFee.toFixed(2)}</span>
            </div>
            <div class="border-t border-black/10 pt-2 flex justify-between font-bold text-sm">
              <span>Total Due</span>
              <span class="text-[#e8752d]">$${total}</span>
            </div>
          </div>
        </div>

        <div class="border-t border-black/5 bg-[#f4f8fc] px-4 py-3.5">
          <button
            id="btn-confirm-pay"
            class="w-full rounded-2xl bg-[#e8752d] py-3.5 text-sm font-semibold text-white shadow-lg shadow-[#e8752d]/30 active:scale-[0.98] cursor-pointer flex items-center justify-center gap-2"
          >
            Authorize Escrow &amp; Place Order ($${total})
          </button>
        </div>
      `;

      document.getElementById("btn-back-quotes").onclick = () => {
        state.screen = "quotes";
        render();
      };

      document.querySelectorAll(".btn-delivery").forEach(btn => {
        btn.onclick = () => {
          state.deliveryOption = btn.getAttribute("data-opt");
          render();
        };
      });

      document.querySelectorAll("input[name='payplan']").forEach(radio => {
        radio.onchange = (e) => {
          state.paymentPlan = e.target.value;
          render();
        };
      });

      document.getElementById("btn-confirm-pay").onclick = () => {
        const btn = document.getElementById("btn-confirm-pay");
        btn.innerHTML = `<span class="animate-spin mr-2">&#9881;</span> Securing in Escrow...`;
        btn.disabled = true;

        setTimeout(() => {
          const newOrder = {
            id: `PM-${Math.floor(1000 + Math.random() * 9000)}`,
            date: "Just now",
            partName: p.name,
            photoUrl: p.photoUrl,
            material: state.material,
            shop: shop.name,
            price: parseFloat(total),
            status: "Slicing",
            statusText: "Verified & Sent to Slicer",
            layerCurrent: 0,
            layerTotal: 280,
            progressPct: 15,
            eta: "Today, 4:30 PM",
            escrowStatus: "Protected in Escrow",
            pickupLocation: `${shop.name}, Springfield`
          };
          state.orders.unshift(newOrder);
          state.screen = "orders";
          render();
        }, 1100);
      };
    }

    // 5. Orders Tracking Screen
    function renderOrders(app) {
      app.innerHTML = `
        <header class="flex items-center justify-between border-b border-black/5 bg-[#eaf1f9] px-4 py-3.5">
          <div class="flex items-center gap-2">
            <h1 class="text-base font-bold text-[#0f2a4a]">Print Orders</h1>
            <span class="rounded-full bg-[#e8752d] px-2 py-0.2 text-[10px] font-bold text-white">${state.orders.length}</span>
          </div>
          <span class="text-xs text-[#0f2a4a]/40 font-medium">Springfield Hub</span>
        </header>

        <div class="flex-1 overflow-y-auto px-4 py-4 space-y-4 no-scrollbar">
          ${state.orders.map(o => `
            <div class="rounded-2xl border border-black/5 bg-[#f4f8fc] p-4 shadow-sm space-y-3">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-1.5">
                  <span class="text-xs font-bold text-[#0f2a4a]">${o.id}</span>
                  <span class="text-xs text-[#0f2a4a]/40">&bull; ${o.date}</span>
                </div>
                <span class="text-[10px] font-bold text-green-700 bg-green-100 px-2 py-0.5 rounded-full flex items-center gap-1">
                  <span class="h-1.5 w-1.5 rounded-full bg-green-500"></span>
                  ${o.status}
                </span>
              </div>

              <div class="flex items-center gap-3">
                <img src="${o.photoUrl}" alt="${o.partName}" class="h-14 w-14 rounded-xl object-cover ring-1 ring-black/10" />
                <div class="min-w-0 flex-1">
                  <h4 class="font-bold text-sm text-[#0f2a4a] truncate">${o.partName}</h4>
                  <p class="text-xs text-[#0f2a4a]/60">${o.shop} &bull; ${o.material}</p>
                  <p class="text-xs font-bold text-[#e8752d] mt-0.5">$${o.price.toFixed(2)}</p>
                </div>
              </div>

              <!-- Live Progress Stepper -->
              <div class="rounded-xl bg-white p-3 space-y-2 border border-black/5">
                <div class="flex items-center justify-between text-xs">
                  <span class="font-semibold text-[#0f2a4a] flex items-center gap-1.5">
                    <span class="animate-pulse h-2 w-2 rounded-full bg-[#e8752d]"></span>
                    ${o.statusText}
                  </span>
                  <span class="text-[#0f2a4a]/60 text-[11px]">ETA: ${o.eta}</span>
                </div>

                <div class="h-2 w-full overflow-hidden rounded-full bg-black/5">
                  <div class="h-full rounded-full bg-gradient-to-r from-[#f28c4a] to-[#e8752d]" style="width: ${o.progressPct}%"></div>
                </div>

                <div class="flex justify-between text-[10px] text-[#0f2a4a]/50">
                  <span>Layer ${o.layerCurrent} of ${o.layerTotal}</span>
                  <span class="font-bold text-green-700">${o.escrowStatus}</span>
                </div>
              </div>

              <div class="flex gap-2">
                <button class="btn-view-part-spec flex-1 rounded-xl bg-[#0f2a4a] py-2 text-xs font-semibold text-white hover:bg-[#17385f] cursor-pointer">
                  Inspect 3D Specs
                </button>
                <button class="btn-open-order-chat rounded-xl border border-black/10 bg-white px-3.5 py-2 text-xs font-semibold text-[#0f2a4a] hover:bg-black/5 cursor-pointer" data-shop-name="${o.shop}">
                  Chat Shop
                </button>
              </div>
            </div>
          `).join('')}
        </div>

        ${renderBottomNav("orders")}
        ${renderChatDrawer()}
      `;

      document.querySelectorAll(".btn-view-part-spec").forEach(btn => {
        btn.onclick = () => {
          state.screen = "request";
          render();
        };
      });

      document.querySelectorAll(".btn-open-order-chat").forEach(btn => {
        btn.onclick = () => {
          const shopName = btn.getAttribute("data-shop-name");
          const found = PRINTER_SHOPS.find(s => s.name === shopName) || PRINTER_SHOPS[0];
          window.openChatWithShop(found.id);
        };
      });

      setupChatEvents();
      setupNavEvents();
    }

    // 6. Account Screen
    function renderAccount(app) {
      app.innerHTML = `
        <header class="flex items-center justify-between border-b border-black/5 bg-[#eaf1f9] px-4 py-3.5">
          <h1 class="text-base font-bold text-[#0f2a4a]">Account &amp; Security</h1>
          <span class="text-xs text-green-700 font-bold bg-green-100 px-2 py-0.5 rounded-full">Verified</span>
        </header>

        <div class="flex-1 overflow-y-auto px-4 py-4 space-y-4 no-scrollbar">
          <!-- Profile Card -->
          <div class="rounded-2xl border border-black/5 bg-[#f4f8fc] p-4 flex items-center gap-3">
            <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-[#0f2a4a] text-white font-bold text-lg">
              D
            </div>
            <div class="flex-1">
              <h3 class="font-bold text-sm text-[#0f2a4a]">Damian</h3>
              <p class="text-xs text-[#0f2a4a]/60">Springfield Buyer &bull; Poly POD Pro</p>
              <div class="mt-1 flex items-center gap-2 text-[10px] text-green-700 font-semibold">
                <span>Escrow Protected</span>
                <span>&bull;</span>
                <span>4 Completed Orders</span>
              </div>
            </div>
          </div>

          <!-- Security Badges -->
          <div class="rounded-2xl bg-white p-4 border border-black/5 space-y-3">
            <h4 class="text-xs font-bold uppercase tracking-wider text-[#0f2a4a]/60">Security &amp; Trust</h4>
            <div class="flex items-center justify-between py-1">
              <div class="flex items-center gap-2 text-xs">
                <span class="text-green-600 font-bold">&check;</span>
                <span>256-Bit SSL End-to-End Encryption</span>
              </div>
              <span class="text-[10px] text-[#0f2a4a]/40 font-mono">Active</span>
            </div>
            <div class="flex items-center justify-between py-1">
              <div class="flex items-center gap-2 text-xs">
                <span class="text-green-600 font-bold">&check;</span>
                <span>Payment Escrow Release Authorization</span>
              </div>
              <span class="text-[10px] text-[#0f2a4a]/40 font-mono">Manual OK</span>
            </div>
            <div class="flex items-center justify-between py-1">
              <div class="flex items-center gap-2 text-xs">
                <span class="text-green-600 font-bold">&check;</span>
                <span>Local Quality Tolerance Guarantee (0.15mm)</span>
              </div>
              <span class="text-[10px] text-[#0f2a4a]/40 font-mono">Enforced</span>
            </div>
          </div>

          <!-- Settings Options -->
          <div class="rounded-2xl bg-white p-2 border border-black/5 divide-y divide-black/5">
            <button class="w-full text-left p-3 text-xs font-semibold text-[#0f2a4a] flex justify-between items-center cursor-pointer hover:bg-black/5 rounded-xl">
              <span>Saved Springfield Delivery Addresses</span>
              <span class="text-[#0f2a4a]/40">&rsaquo;</span>
            </button>
            <button class="w-full text-left p-3 text-xs font-semibold text-[#0f2a4a] flex justify-between items-center cursor-pointer hover:bg-black/5 rounded-xl">
              <span>Payment Methods &amp; Split Billing</span>
              <span class="text-[#0f2a4a]/40">&rsaquo;</span>
            </button>
            <button class="w-full text-left p-3 text-xs font-semibold text-[#0f2a4a] flex justify-between items-center cursor-pointer hover:bg-black/5 rounded-xl">
              <span>CAD Slicer Export &amp; Mesh Preferences</span>
              <span class="text-[#0f2a4a]/40">&rsaquo;</span>
            </button>
          </div>
        </div>

        ${renderBottomNav("account")}
      `;

      setupNavEvents();
    }

    // 7. Owner Dashboard
    function renderOwnerDashboard(app) {
      const hub = state.printerHub;

      app.innerHTML = `
        <header class="bg-[#0a1e35] px-4 pb-4 pt-5 text-white">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-xs text-white/60">Operator Console</p>
              <h2 class="text-sm font-bold text-white">${hub.name}</h2>
            </div>
            <div class="flex items-center gap-1 rounded-full bg-white/10 p-1 text-xs">
              <button id="owner-back-buyer" class="rounded-full px-2.5 py-1 text-white/60 hover:text-white cursor-pointer">Buyer</button>
              <button class="rounded-full bg-[#e8752d] px-2.5 py-1 font-semibold text-white shadow-xs">Owner</button>
            </div>
          </div>

          <div class="mt-3 grid grid-cols-2 gap-2">
            <div class="rounded-xl bg-white/10 p-2.5">
              <p class="text-[10px] text-white/60">Today's Earnings</p>
              <p class="text-lg font-bold text-[#f28c4a]">$${hub.earningsToday.toFixed(2)}</p>
            </div>
            <div class="rounded-xl bg-white/10 p-2.5">
              <p class="text-[10px] text-white/60">Shop Rating</p>
              <p class="text-lg font-bold text-white">&#9733; ${hub.rating} <span class="text-xs font-normal text-white/60">(${hub.completedJobs} done)</span></p>
            </div>
          </div>
        </header>

        <div class="flex-1 overflow-y-auto px-4 py-4 space-y-4 no-scrollbar">
          <!-- Active Machines -->
          <div>
            <h3 class="text-xs font-bold uppercase tracking-wider text-[#0f2a4a]/60 mb-2">Machine Status</h3>
            <div class="space-y-2">
              ${hub.machines.map(m => `
                <div class="rounded-2xl border border-black/5 bg-[#f4f8fc] p-3 shadow-xs">
                  <div class="flex items-center justify-between">
                    <h4 class="font-bold text-xs text-[#0f2a4a]">${m.name}</h4>
                    <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${m.status.includes('Printing') ? 'bg-orange-100 text-orange-700' : 'bg-green-100 text-green-700'}">
                      ${m.status}
                    </span>
                  </div>
                  <div class="mt-2 flex items-center justify-between text-[11px] text-[#0f2a4a]/70">
                    <span>${m.job}</span>
                    <span class="font-mono">${m.temp}</span>
                  </div>
                  ${m.pct > 0 ? `
                    <div class="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-black/10">
                      <div class="h-full rounded-full bg-[#e8752d]" style="width: ${m.pct}%"></div>
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Incoming Buyer Job Queue -->
          <div>
            <h3 class="text-xs font-bold uppercase tracking-wider text-[#0f2a4a]/60 mb-2">Incoming Buyer Orders</h3>
            <div class="rounded-2xl border-2 border-[#e8752d]/40 bg-[#fdf5f0] p-4 shadow-sm space-y-3">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-[#0f2a4a]">${state.selectedPreset.name}</span>
                <span class="text-xs font-bold text-[#e8752d]">$16.50</span>
              </div>
              <p class="text-xs text-[#0f2a4a]/70 leading-relaxed">
                Reconstructed manifold 3D mesh &bull; ~${state.selectedPreset.estimatedGrams}g ${state.material} &bull; Downtown Springfield buyer
              </p>
              <div class="flex gap-2">
                <button id="btn-owner-accept" class="flex-1 rounded-xl bg-[#0f2a4a] py-2 text-xs font-semibold text-white hover:bg-[#17385f] cursor-pointer">
                  Accept Job &amp; Send to Slicer
                </button>
                <button class="rounded-xl border border-black/10 bg-white px-3 py-2 text-xs font-semibold text-[#0f2a4a] cursor-pointer">
                  Decline
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="border-t border-black/5 bg-[#f4f8fc] px-4 py-3">
          <button id="btn-return-buyer-mode" class="w-full rounded-2xl bg-[#0f2a4a] py-3 text-xs font-semibold text-white cursor-pointer">
            Switch back to Buyer Marketplace
          </button>
        </div>
      `;

      const backBuyer = document.getElementById("owner-back-buyer");
      if (backBuyer) {
        backBuyer.onclick = () => {
          state.role = "buyer";
          state.screen = "home";
          render();
        };
      }

      const returnBuyer = document.getElementById("btn-return-buyer-mode");
      if (returnBuyer) {
        returnBuyer.onclick = () => {
          state.role = "buyer";
          state.screen = "home";
          render();
        };
      }

      const btnAccept = document.getElementById("btn-owner-accept");
      if (btnAccept) {
        btnAccept.onclick = () => {
          btnAccept.innerHTML = "&check; Slicing Job Queued on Bambu Lab #1";
          btnAccept.disabled = true;
          setTimeout(() => {
            state.role = "buyer";
            state.screen = "orders";
            render();
          }, 800);
        };
      }
    }

    // Bottom Navigation Bar
    function renderBottomNav(activeTab) {
      return `
        <nav class="sticky bottom-0 z-20 flex items-stretch border-t border-black/5 bg-white/95 backdrop-blur">
          <button id="nav-home" class="relative flex flex-1 flex-col items-center gap-1 py-2.5 text-[11px] font-medium cursor-pointer ${activeTab === 'home' ? 'text-[#e8752d]' : 'text-[#0f2a4a]/40'}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Home
          </button>
          <button id="nav-orders" class="relative flex flex-1 flex-col items-center gap-1 py-2.5 text-[11px] font-medium cursor-pointer ${activeTab === 'orders' ? 'text-[#e8752d]' : 'text-[#0f2a4a]/40'}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
            Orders
            ${state.orders.length > 0 ? `<span class="absolute top-2 right-6 h-1.5 w-1.5 rounded-full bg-[#e8752d]"></span>` : ''}
          </button>
          <button id="nav-account" class="relative flex flex-1 flex-col items-center gap-1 py-2.5 text-[11px] font-medium cursor-pointer ${activeTab === 'account' ? 'text-[#e8752d]' : 'text-[#0f2a4a]/40'}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Account
          </button>
        </nav>
      `;
    }

    function setupNavEvents() {
      const navHome = document.getElementById("nav-home");
      if (navHome) {
        navHome.onclick = () => {
          state.screen = "home";
          render();
        };
      }
      const navOrders = document.getElementById("nav-orders");
      if (navOrders) {
        navOrders.onclick = () => {
          state.screen = "orders";
          render();
        };
      }
      const navAccount = document.getElementById("nav-account");
      if (navAccount) {
        navAccount.onclick = () => {
          state.screen = "account";
          render();
        };
      }
    }

    // Initial render
    render();
  </script>
</body>
</html>
