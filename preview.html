    function createImageHeightfieldGeometry(img, dims) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const nx = 32;
      const ny = 32;
      canvas.width = nx;
      canvas.height = ny;
      ctx.drawImage(img, 0, 0, nx, ny);
      const imgData = ctx.getImageData(0, 0, nx, ny).data;

      const w = dims.x / 18;
      const h = dims.y / 18;
      const maxDepth = dims.z / 22;
      const baseThickness = 0.38;

      const positions = [];
      const uvs = [];
      const indices = [];

      const heights = [];
      for (let j = 0; j < ny; j++) {
        heights[j] = [];
        for (let i = 0; i < nx; i++) {
          const idx = (j * nx + i) * 4;
          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];
          const a = imgData[idx + 3] / 255;
          const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          const relief = (1 - lum) * a;
          heights[j][i] = baseThickness + relief * maxDepth;
        }
      }

      // Top surface
      for (let j = 0; j < ny; j++) {
        const y = ((j / (ny - 1)) - 0.5) * h;
        for (let i = 0; i < nx; i++) {
          const x = ((i / (nx - 1)) - 0.5) * w;
          const z = heights[j][i];
          positions.push(x, y, z);
          uvs.push(i / (nx - 1), 1 - (j / (ny - 1)));
        }
      }

      for (let j = 0; j < ny - 1; j++) {
        for (let i = 0; i < nx - 1; i++) {
          const a = j * nx + i;
          const b = j * nx + (i + 1);
          const c = (j + 1) * nx + i;
          const d = (j + 1) * nx + (i + 1);
          indices.push(a, b, c);
          indices.push(b, d, c);
        }
      }

      // Bottom flat base plate
      const bottomOffset = positions.length / 3;
      for (let j = 0; j < ny; j++) {
        const y = ((j / (ny - 1)) - 0.5) * h;
        for (let i = 0; i < nx; i++) {
          const x = ((i / (nx - 1)) - 0.5) * w;
          positions.push(x, y, 0);
          uvs.push(i / (nx - 1), 1 - (j / (ny - 1)));
        }
      }

      for (let j = 0; j < ny - 1; j++) {
        for (let i = 0; i < nx - 1; i++) {
          const a = bottomOffset + (j * nx + i);
          const b = bottomOffset + (j * nx + (i + 1));
          const c = bottomOffset + ((j + 1) * nx + i);
          const d = bottomOffset + ((j + 1) * nx + (i + 1));
          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      // Side skirts
      for (let i = 0; i < nx - 1; i++) {
        const t1 = i, t2 = i + 1;
        const b1 = bottomOffset + i, b2 = bottomOffset + i + 1;
        indices.push(t1, b1, t2);
        indices.push(t2, b1, b2);
      }
      for (let i = 0; i < nx - 1; i++) {
        const t1 = (ny - 1) * nx + i, t2 = (ny - 1) * nx + i + 1;
        const b1 = bottomOffset + (ny - 1) * nx + i, b2 = bottomOffset + (ny - 1) * nx + i + 1;
        indices.push(t1, t2, b1);
        indices.push(t2, b2, b1);
      }
      for (let j = 0; j < ny - 1; j++) {
        const t1 = j * nx, t2 = (j + 1) * nx;
        const b1 = bottomOffset + j * nx, b2 = bottomOffset + (j + 1) * nx;
        indices.push(t1, t2, b1);
        indices.push(t2, b2, b1);
      }
      for (let j = 0; j < ny - 1; j++) {
        const t1 = j * nx + (nx - 1), t2 = (j + 1) * nx + (nx - 1);
        const b1 = bottomOffset + j * nx + (nx - 1), b2 = bottomOffset + (j + 1) * nx + (nx - 1);
        indices.push(t1, b1, t2);
        indices.push(t2, b1, b2);
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      geom.center();
      return geom;
    }

    function createPartGeometry(type, dims) {
      const sx = dims.x / 20;
      const sy = dims.y / 20;
      const sz = dims.z / 20;

      if (type === "knob") {
        return new THREE.CylinderGeometry(sx * 0.9, sx * 0.95, sy * 0.8, 28);
      }
      if (type === "clip") {
        const shape = new THREE.Shape();
        shape.moveTo(-sx, -sy);
        shape.lineTo(sx, -sy);
        shape.lineTo(sx, sy);
        shape.lineTo(sx * 0.6, sy);
        shape.lineTo(sx * 0.6, -sy * 0.5);
        shape.lineTo(-sx * 0.6, -sy * 0.5);
        shape.lineTo(-sx * 0.6, sy);
        shape.lineTo(-sx, sy);
        shape.closePath();
        const geom = new THREE.ExtrudeGeometry(shape, { steps: 1, depth: sz, bevelEnabled: true, bevelThickness: 0.15, bevelSize: 0.15, bevelSegments: 2 });
        geom.center();
        return geom;
      }
      if (type === "enclosure") {
        return new THREE.BoxGeometry(sx * 1.6, sy * 1.1, sz * 0.8, 4, 4, 4);
      }
      if (type === "bracket") {
        const shape = new THREE.Shape();
        const t = 0.45;
        shape.moveTo(0, 0);
        shape.lineTo(sx * 1.2, 0);
        shape.lineTo(sx * 1.2, t);
        shape.lineTo(t, t);
        shape.lineTo(t, sy * 1.2);
        shape.lineTo(0, sy * 1.2);
        shape.closePath();
        const geom = new THREE.ExtrudeGeometry(shape, { steps: 1, depth: sz * 1.1, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.1, bevelSegments: 3 });
        geom.center();
        return geom;
      }
      return new THREE.BoxGeometry(sx, sy, sz);
    }

    function init3DViewer() {
      const canvas = document.getElementById('three-canvas');
      const container = document.getElementById('canvas-container');
      if (!canvas || !container) return;

      if (viewport.animFrame) cancelAnimationFrame(viewport.animFrame);
      if (viewport.renderer) viewport.renderer.dispose();

      const width = container.clientWidth || 360;
      const height = 230;

      const scene = new THREE.Scene();
      viewport.scene = scene;

      const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 100);
      camera.position.set(4.2, 3.5, 4.5);
      camera.lookAt(0, 0, 0);
      viewport.camera = camera;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      viewport.renderer = renderer;

      // Lights
      const ambient = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambient);
      const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
      keyLight.position.set(5, 8, 4);
      scene.add(keyLight);
      const fillLight = new THREE.DirectionalLight(0x90b0e0, 0.6);
      fillLight.position.set(-5, 2, -3);
      scene.add(fillLight);

      // Bed Grid
      const grid = new THREE.GridHelper(6, 12, 0x3d5a80, 0x1f334a);
      grid.position.y = -1.2;
      scene.add(grid);

      const p = state.selectedPreset;
      let geom;

      if (p.isCustomPhoto && p.imgElement) {
        geom = createImageHeightfieldGeometry(p.imgElement, p.dimensions);
      } else {
        geom = createPartGeometry(p.type, p.dimensions);
      }

      const matColor = state.material === "PETG" ? 0xe8752d : (state.material === "PLA" ? 0x2563eb : (state.material === "ABS" || state.material === "ABS-ESD" ? 0x475569 : 0x10b981));

      const material = new THREE.MeshStandardMaterial({
        color: matColor,
        roughness: 0.35,
        metalness: 0.15,
        wireframe: state.wireframe
      });

      if (p.isCustomPhoto && state.viewMode === "textured") {
        const texLoader = new THREE.TextureLoader();
        texLoader.load(p.photoUrl, (tex) => {
          if (viewport.mesh && viewport.mesh.material && state.viewMode === "textured") {
            viewport.mesh.material.map = tex;
            viewport.mesh.material.color.setHex(0xffffff);
            viewport.mesh.material.needsUpdate = true;
          }
        });
      }

      const mesh = new THREE.Mesh(geom, material);
      scene.add(mesh);
      viewport.mesh = mesh;

      // Orbit Interactions
      const onDown = (e) => {
        viewport.isDragging = true;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        viewport.prevMouse = { x: cx, y: cy };
        if (e.touches && e.cancelable) e.preventDefault();
      };

      const onMove = (e) => {
        if (!viewport.isDragging || !viewport.mesh) return;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        const dx = cx - viewport.prevMouse.x;
        const dy = cy - viewport.prevMouse.y;
        viewport.mesh.rotation.y += dx * 0.012;
        viewport.mesh.rotation.x += dy * 0.012;
        viewport.prevMouse = { x: cx, y: cy };
        if (e.touches && e.cancelable) e.preventDefault();
      };

      const onUp = () => { viewport.isDragging = false; };

      canvas.onmousedown = onDown;
      canvas.ontouchstart = onDown;
      window.onmousemove = onMove;
      window.ontouchmove = onMove;
      window.onmouseup = onUp;
      window.ontouchend = onUp;

      const animate = () => {
        viewport.animFrame = requestAnimationFrame(animate);
        if (viewport.mesh && state.autoRotate && !viewport.isDragging) {
          viewport.mesh.rotation.y += 0.008;
        }
        renderer.render(scene, camera);
      };
      animate();
    }

    function resetCamera() {
      if (!viewport.camera || !viewport.mesh) return;
      viewport.camera.position.set(4.2, 3.5, 4.5);
      viewport.camera.lookAt(0, 0, 0);
      viewport.mesh.rotation.set(0, 0, 0);
    }

    function exportSTL() {
      if (!viewport.mesh) return;
      const rawGeom = viewport.mesh.geometry;
      const g = rawGeom.index ? rawGeom.toNonIndexed() : rawGeom;
      const pos = g.attributes.position;
      const numTriangles = pos.count / 3;
      const buffer = new ArrayBuffer(84 + 50 * numTriangles);
      const view = new DataView(buffer);
      view.setUint32(80, numTriangles, true);

      for (let i = 0; i < numTriangles; i++) {
        const offset = 84 + i * 50;
        for (let v = 0; v < 3; v++) {
          const idx = i * 3 + v;
          view.setFloat32(offset + 12 + v * 12, pos.getX(idx), true);
          view.setFloat32(offset + 16 + v * 12, pos.getY(idx), true);
          view.setFloat32(offset + 20 + v * 12, pos.getZ(idx), true);
        }
      }

      const blob = new Blob([buffer], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${state.selectedPreset.id || 'reconstructed'}_part.stl`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Leaflet Printer Map Initialization
    function initPrinterMap() {
      const mapContainer = document.getElementById("printer-leaflet-map");
      if (!mapContainer || typeof L === 'undefined') return;

      if (state.leafletMap) {
        try { state.leafletMap.remove(); } catch(e) {}
        state.leafletMap = null;
      }

      const map = L.map("printer-leaflet-map", { scrollWheelZoom: false }).setView([30.0035, -91.8187], 13);
      state.leafletMap = map;

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      PRINTER_SHOPS.forEach(s => {
        // Service Radius Circle
        L.circle([s.lat, s.lng], {
          color: s.color,
          fillColor: s.color,
          fillOpacity: 0.12,
          weight: 1.5,
          radius: s.radiusMi * 1609.34
        }).addTo(map);

        // Custom Pin Marker
        const customIcon = L.divIcon({
          className: '',
          html: `<div style="width:36px;height:36px;border-radius:50%;background:${s.color};border:3px solid white;box-shadow:0 2px 8px rgba(15,42,74,0.35);display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:12px;font-family:sans-serif;">${s.name.charAt(0)}</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18],
          popupAnchor: [0, -20]
        });

        const marker = L.marker([s.lat, s.lng], { icon: customIcon }).addTo(map);

        const popupContent = `
          <div style="min-width:180px;font-family:'Inter',sans-serif;padding:2px;">
            <div style="font-weight:bold;font-size:13px;color:#0f2a4a;">${s.name}</div>
            <div style="font-size:11px;color:#666;margin-top:2px;">Owner: ${s.ownerName} &bull; ${s.distance}</div>
            <div style="font-size:11px;color:#e8752d;font-weight:600;margin-top:2px;">&#9733; ${s.rating} &bull; ${s.turnaround} ready</div>
            <div style="font-size:10px;color:#888;margin-top:3px;">${s.machines}</div>
            <div style="display:flex;gap:6px;margin-top:8px;">
              <button type="button" aria-label="Get instant quote from ${s.name}" onclick="window.requestQuoteFromMap('${s.id}')" style="flex:1;background:#e8752d;color:white;border:none;padding:5px 8px;border-radius:8px;font-size:11px;font-weight:bold;cursor:pointer;">Get Quote</button>

            </div>
          </div>
        `;
        marker.bindPopup(popupContent);
      });

      setTimeout(() => { map.invalidateSize(); }, 200);
    }

    // AI 2D-to-3D Reconstruction Pipeline
    function triggerAIPhotoReconstruction(file, photoUrl) {
      state.screen = "request";
      state.showUploadMenu = false;
      state.isGenerating = true;
      state.generationProgress = 15;
      state.generationStage = "Ingesting 2D reference photo & extracting edge boundaries...";

      const rawName = file ? file.name : "reference_image.jpg";
      const cleanName = file ? file.name.replace(/\.[^/.]+$/, "") : "Custom 3D Part";
      const fileSize = file ? (file.size / 1024).toFixed(1) + " KB" : "96.4 KB";

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        const aspect = img.naturalWidth / Math.max(1, img.naturalHeight);
        const calcX = Math.round(52 * Math.max(0.65, Math.min(1.6, aspect)));
        const calcY = 44;
        const calcZ = 22;
        const calcGrams = Math.max(16, Math.round((calcX * calcY * calcZ) / 1050));

        const newCustomPreset = {
          id: "custom_" + Date.now(),
          name: cleanName,
          type: "heightfield",
          isCustomPhoto: true,
          photoUrl: photoUrl,
          imgElement: img,
          fileName: rawName,
          fileSize: fileSize,
          dimensions: { x: calcX, y: calcY, z: calcZ },
          estimatedGrams: calcGrams,
          recommendedMaterial: "PETG",
          infillRecommendation: "35% gyroid",
          agentSummary: `AI analyzed 2D reference photo "${rawName}" (${img.naturalWidth} x ${img.naturalHeight}px). Extracted silhouette boundary, symmetry planes, and surface depth topology. Reconstructed watertight manifold 3D mesh with 2.4mm minimum structural wall thickness.`,
        };

        state.selectedPreset = newCustomPreset;
        state.customPresets.unshift(newCustomPreset);
        state.material = "PETG";
        state.viewMode = "textured";

        saveAppState();
        render();

        const stages = [
          { progress: 34, stage: "Detecting 2D perspective vanishing points & contours..." },
          { progress: 60, stage: "Inferring volumetric depth field & 3D symmetry planes..." },
          { progress: 80, stage: "Synthesizing manifold 3D polygon mesh with Meshy AI engine..." },
          { progress: 94, stage: "Verifying wall thickness (2.4mm) & FDM slicer printability..." },
          { progress: 100, stage: "3D Model Synthesized Successfully! Watertight & Manifold." },
        ];

        let idx = 0;
        const interval = setInterval(() => {
          if (idx < stages.length) {
            state.generationProgress = stages[idx].progress;
            state.generationStage = stages[idx].stage;
            idx++;
            const bar = document.getElementById("gen-progress-bar");
            const text = document.getElementById("gen-progress-stage");
            const pct = document.getElementById("gen-progress-pct");
            if (bar) bar.style.width = `${state.generationProgress}%`;
            if (text) text.textContent = state.generationStage;
            if (pct) pct.textContent = `${state.generationProgress}%`;
          } else {
            clearInterval(interval);
            state.isGenerating = false;
            saveAppState();
            render();
            showToast("3D model synthesized successfully!", "success");
          }
        }, 450);
      };
      img.src = photoUrl;
    }

      state.screen = "request";

        id: "cad_" + Date.now(),

        fileName: file.name,
        fileSize: (file.size / 1024).toFixed(1) + " KB",
        dimensions: { x: 50, y: 36, z: 22 },
        estimatedGrams: 38,
        recommendedMaterial: "PLA",
        infillRecommendation: "30% gyroid",
        agentSummary: `Imported direct CAD geometry from "${file.name}". Verified manifold geometry and validated layer support angles for local print shops.`,

      state.selectedPreset = newCAD;

    // Main Router

      const app = document.getElementById("app");

      else if (state.screen === "request") renderRequest(app);

      else if (state.screen === "checkout") renderCheckout(app);
      else if (state.screen === "orders") renderOrders(app);

    function setupChatEvents() {
      const closeBtn = document.getElementById("btn-close-chat");
      const backdrop = document.getElementById("chat-modal-backdrop");
      const input = document.getElementById("chat-input");
      const sendBtn = document.getElementById("btn-send-chat");
      const container = document.getElementById("chat-messages-container");

      const closeChat = () => {
        state.chatOpen = false;
        render();
      };

      if (closeBtn) closeBtn.onclick = closeChat;
      if (backdrop) {
        backdrop.onclick = (e) => {
          if (e.target === backdrop) closeChat();
        };
      }

      const sendUserMessage = (text) => {
        if (!text || !text.trim()) return;
        const msg = text.trim();
        state.chatMessages.push({
          sender: "user",
          text: msg,
          time: "Just now"
        });
        saveAppState();
        if (input) input.value = "";
        render();

        // Simulate Operator Response
        setTimeout(() => {
          const typingEl = document.getElementById("chat-typing-indicator");
          if (typingEl) typingEl.classList.remove("hidden");
          const msgContainer = document.getElementById("chat-messages-container");
          if (msgContainer) msgContainer.scrollTop = msgContainer.scrollHeight;

          setTimeout(() => {
            let reply = `Got it! I reviewed the 3D model volume. Overhangs look well within 45 degrees, so it will print clean without surface scars. Ready when you are!`;
            const lower = msg.toLowerCase();
            if (lower.includes("petg") || lower.includes("material")) {
              reply = `Yes! We have Bambu PETG-CF and standard PETG loaded right now. It gives great layer adhesion and heat resistance up to 75&deg;C. Perfect for functional parts.`;
            } else if (lower.includes("today") || lower.includes("pick up") || lower.includes("pickup") || lower.includes("new iberia")) {
              reply = `Yes! Our queue is clear on Bambu Lab #1 here in New Iberia. If you place the quote order within the hour, it will be ready for local hub pickup by 4:30 PM today.`;
            } else if (lower.includes("tolerance")) {
              reply = `We calibrate with a 0.4mm hardened nozzle regularly. Typical dimensional accuracy is &plusmn;0.15mm, perfect for M4 mounting holes and snap fits.`;
            }

            state.chatMessages.push({
              sender: "shop",
              text: reply,
              time: "Just now"
            });
            saveAppState();
            render();
            const finalContainer = document.getElementById("chat-messages-container");
            if (finalContainer) finalContainer.scrollTop = finalContainer.scrollHeight;
          }, 1100);
        }, 200);
      };

      if (sendBtn && input) {
        sendBtn.onclick = () => sendUserMessage(input.value);
        input.onkeydown = (e) => {
          if (e.key === "Enter") sendUserMessage(input.value);
        };
      }

      document.querySelectorAll(".btn-quick-chat").forEach(btn => {
        btn.onclick = () => {
          const msg = btn.getAttribute("data-msg");
          sendUserMessage(msg);
        };
      });

      if (container) container.scrollTop = container.scrollHeight;
    }

          state.screen = "orders";
          render();
        };
      }
      const navAccount = document.getElementById("nav-account");
      if (navAccount) {
        navAccount.onclick = () => {
          state.screen = "account";
          render();
        };
      }
    }

    // Initial render
    render();
  </script>
</body>
</html>
